  <title>Citas Médicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
    html,body{height:100%;background:#FDF5EF;font-family:'Nunito',sans-serif;color:#2C1810;overscroll-behavior:none;}
    button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;background:none;}
    button:active{transform:scale(0.96);opacity:0.85;}
    input,textarea{font-family:'Nunito',sans-serif;}
    input:focus,textarea:focus{outline:none;}
    #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

    /* ── PANTALLAS ── */
    .screen{display:none;flex-direction:column;min-height:100vh;animation:fadeIn .18s ease;}
    .screen.active{display:flex;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

    /* ── CABECERA DASHBOARD ── */
    .dash-header{
      background:linear-gradient(145deg,#9C3D18 0%,#C75B2A 60%,#E8895A 100%);
      color:#fff;padding:20px 18px 36px;text-align:center;
      border-radius:0 0 32px 32px;
      box-shadow:0 8px 32px #C75B2A44;
    }
    .sync-row{display:flex;justify-content:flex-end;margin-bottom:8px;}
    .sync-pill{font-size:12px;font-weight:800;padding:4px 12px;border-radius:20px;letter-spacing:.2px;}
    .sync-ok{background:#4ADE8022;color:#166534;border:1px solid #4ADE8055;}
    .sync-saving{background:#FCD34D22;color:#92400E;border:1px solid #FCD34D55;}
    .sync-err{background:#F8717122;color:#991B1B;border:1px solid #F8717155;}
    .hero-emoji{font-size:76px;line-height:1;margin-bottom:4px;}
    .hero-name{font-size:54px;font-weight:900;line-height:1.05;text-shadow:0 2px 12px #00000022;}
    .hero-sub{font-size:18px;opacity:.88;font-weight:600;margin-top:6px;}

    /* ── CUERPO DASHBOARD ── */
    .dash-body{padding:16px 14px 48px;display:flex;flex-direction:column;gap:14px;margin-top:-14px;}

    .switch-btn{
      display:flex;align-items:center;gap:14px;
      background:#fff;border:2px solid #EDD8CC;border-radius:20px;
      padding:16px 18px;width:100%;text-align:left;
      box-shadow:0 4px 16px #00000010;
    }
    .switch-label{flex:1;}
    .switch-small{font-size:12px;font-weight:700;color:#A07060;text-transform:uppercase;letter-spacing:.5px;}
    .switch-name{font-size:22px;font-weight:900;color:#3D2010;}
    .switch-arrow{font-size:24px;color:#C75B2A;}

    .cal-btn{
      display:flex;align-items:center;gap:16px;
      padding:18px 20px;border-radius:22px;
      border:2.5px solid #C75B2A;
      background:#fff;width:100%;text-align:left;
      box-shadow:0 4px 16px #C75B2A18;
    }
    .cal-btn-icon{font-size:38px;flex-shrink:0;}
    .cal-btn-title{font-size:21px;font-weight:900;color:#9C3D18;}
    .cal-btn-sub{font-size:14px;font-weight:700;color:#C75B2A;margin-top:2px;}

    .card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 16px #00000008;border:1.5px solid #EDD8CC;display:flex;flex-direction:column;gap:10px;}
    .card-title{font-size:20px;font-weight:800;color:#2C1810;}
    .card-title span{color:#C75B2A;}
    .card-title-manana span{color:#A07060;}
    .empty-card{text-align:center;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:6px;}
    .empty-card .ei{font-size:38px;}
    .empty-card .et{font-size:16px;font-weight:700;color:#78716C;}

    .today-cita{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;background:#FEF3EE;border:1.5px solid #F0C4A8;}
    .today-cita.done{opacity:.6;background:#F9F4F0;border-color:#EDD8CC;}
    .today-cita.manana{background:#F5F0EB;border-color:#DDD0C8;}
    .cita-hora{font-size:13px;font-weight:800;color:#C75B2A;margin-bottom:2px;}
    .cita-hora.manana{color:#A07060;}
    .cita-texto{font-size:17px;font-weight:700;color:#2C1810;}
    .cita-texto.done{text-decoration:line-through;}
    .see-more-btn{background:transparent;border:2px solid #C75B2A;border-radius:12px;padding:11px;font-size:15px;font-weight:800;color:#C75B2A;width:100%;margin-top:2px;}
    .see-more-btn.manana{border-color:#A07060;color:#A07060;}

    /* ── CABECERA PÁGINAS INTERNAS ── */
    .page-header{
      display:flex;align-items:center;padding:14px 12px;gap:8px;flex-shrink:0;
      background:linear-gradient(135deg,#9C3D18 0%,#C75B2A 100%);color:#fff;
    }
    .back-btn{background:rgba(255,255,255,.2);color:#fff;font-size:15px;font-weight:800;padding:9px 13px;border-radius:12px;white-space:nowrap;}
    .page-header-center{text-align:center;flex:1;}
    .page-month{font-size:26px;font-weight:900;line-height:1.1;}
    .page-year{font-size:14px;opacity:.8;}
    .sync-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
    .day-view-name{font-size:24px;font-weight:900;line-height:1.1;}
    .day-view-date{font-size:14px;opacity:.85;margin-top:2px;}

    /* ── NAVEGACIÓN SEMANA ── */
    .week-nav{display:flex;align-items:center;gap:7px;padding:10px 10px;background:#FEF3EE;border-bottom:2px solid #C75B2A20;flex-shrink:0;}
    .nav-btn{flex:1;padding:11px 4px;background:#fff;border:2px solid #C75B2A55;border-radius:12px;font-size:14px;font-weight:800;color:#C75B2A;white-space:nowrap;}
    .today-nav-btn{flex:1;padding:11px 4px;background:#C75B2A;border-radius:12px;font-size:14px;font-weight:800;color:#fff;}
    .range-label{text-align:center;font-size:13px;font-weight:700;color:#A07060;padding:6px 16px 2px;flex-shrink:0;}

    /* ── GRILLA DÍAS ── */
    .days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:7px 7px 0;flex-shrink:0;}
    .day-cell{
      background:#fff;border:1.5px solid #EDD8CC;border-radius:13px;
      padding:7px 3px;cursor:pointer;display:flex;flex-direction:column;
      align-items:center;gap:3px;min-height:100px;position:relative;overflow:hidden;
    }
    .day-cell.today{background:#C75B2A;border-color:transparent;box-shadow:0 6px 20px #C75B2A44;}
    .day-cell.past{background:#F5EEE8;border-color:#E8D8CC;}
    .hoy-badge{font-size:7px;font-weight:900;background:#fff;color:#C75B2A;padding:2px 5px;border-radius:5px;letter-spacing:.5px;position:absolute;top:4px;left:50%;transform:translateX(-50%);}
    .cell-day-name{font-size:10px;font-weight:800;color:#A07060;text-transform:uppercase;letter-spacing:.4px;}
    .day-cell.today .cell-day-name{color:rgba(255,255,255,.8);margin-top:13px;}
    .day-cell.past .cell-day-name{color:#C4A898;}
    .cell-day-num{font-size:22px;font-weight:900;color:#2C1810;line-height:1;}
    .day-cell.today .cell-day-num{color:#fff;}
    .day-cell.past .cell-day-num{color:#C4A898;}
    .dots-row{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:11px;}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .cell-count{font-size:9px;font-weight:800;text-align:center;color:#A07060;line-height:1.2;}
    .day-cell.today .cell-count{color:rgba(255,255,255,.9);}
    .cell-empty{font-size:9px;color:#C4A898;font-weight:600;}

    /* ── LEYENDA ── */
    .legend{display:flex;justify-content:center;gap:18px;padding:10px 16px 16px;font-size:13px;font-weight:700;color:#A07060;flex-shrink:0;}
    .legend-item{display:flex;align-items:center;gap:5px;}

    /* ── DETALLE DÍA ── */
    .cita-list{flex:1;padding:12px 13px 0;display:flex;flex-direction:column;gap:9px;overflow-y:auto;}
    .empty-day{text-align:center;padding:24px 0;display:flex;flex-direction:column;align-items:center;gap:6px;}
    .empty-day .ei{font-size:50px;}
    .empty-day .et{font-size:18px;font-weight:700;color:#78716C;}
    .empty-day .es{font-size:14px;color:#A8A09A;}

    .cita-item{display:flex;align-items:center;gap:11px;background:#fff;border-radius:17px;padding:13px;box-shadow:0 2px 10px #00000008;border:1.5px solid #F0C4A8;}
    .cita-item.done{opacity:.7;background:#F5EEE8;border-color:#EDD8CC;}
    .check-btn{font-size:26px;flex-shrink:0;padding:2px;}
    .item-hora{font-size:13px;font-weight:900;color:#C75B2A;margin-bottom:2px;}
    .item-texto{font-size:18px;font-weight:700;color:#2C1810;line-height:1.3;}
    .item-texto.done{text-decoration:line-through;}
    .item-meta{display:flex;align-items:center;gap:4px;margin-top:5px;flex-wrap:wrap;}
    .badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;}
    .badge-vicente{background:#FEF3EE;color:#9C3D18;border:1px solid #F0C4A8;}
    .badge-conchi{background:#FEE8DC;color:#C75B2A;border:1px solid #F0A882;}
    .badge-ambos{background:#F5F0EB;color:#78716C;border:1px solid #DDD5CC;}
    .badge-meta{font-size:11px;color:#9CA3AF;}
    .del-btn{font-size:21px;padding:3px;flex-shrink:0;}

    /* ── AÑADIR CITA ── */
    .add-section{padding:14px;background:#FDF5EF;border-top:3px solid #EDD8CC;display:flex;flex-direction:column;gap:11px;padding-bottom:28px;flex-shrink:0;}
    .add-title{font-size:19px;font-weight:900;color:#2C1810;}
    .add-input{border:2px solid #C75B2A55;border-radius:13px;padding:13px 15px;font-size:17px;color:#2C1810;background:#fff;width:100%;box-shadow:0 2px 8px #00000008;}
    .hora-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
    .hora-label{font-size:16px;font-weight:700;color:#4A2818;white-space:nowrap;}
    .hora-input{border:2px solid #C75B2A55;border-radius:11px;padding:9px 13px;font-size:17px;color:#2C1810;background:#fff;}
    .hora-opt{font-size:13px;color:#78716C;}
    .for-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
    .for-label{font-size:16px;font-weight:800;color:#4A2818;}
    .for-btn{padding:9px 13px;border-radius:20px;border:2px solid #C75B2A;background:transparent;color:#C75B2A;font-size:14px;font-weight:800;white-space:nowrap;}
    .for-btn.active{background:#C75B2A;color:#fff;}
    .add-btn{border:none;border-radius:15px;padding:17px;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(135deg,#C75B2A 0%,#9C3D18 100%);box-shadow:0 6px 20px #C75B2A44;}
    .add-btn:disabled{background:#D1D5DB;box-shadow:none;opacity:.6;}

    input[type=time]::-webkit-calendar-picker-indicator{cursor:pointer;filter:invert(40%) sepia(80%) saturate(500%) hue-rotate(350deg);}
  </style>
</head>
<body>
<div id="app">

  <!-- ══════════════ DASHBOARD ══════════════ -->
  <div id="screen-dashboard" class="screen">
    <div class="dash-header">
      <div class="sync-row">
        <div id="sync-pill-dash" class="sync-pill sync-ok">✅ Conectado</div>
      </div>
      <div id="hero-emoji" class="hero-emoji">👨</div>
      <div id="hero-name" class="hero-name">Vicente</div>
      <div id="hero-sub" class="hero-sub">Bienvenido, Vicente</div>
    </div>

    <div class="dash-body">
      <button class="switch-btn" onclick="switchUser()">
        <span id="other-emoji" style="font-size:30px">👩</span>
        <div class="switch-label">
          <div class="switch-small">Cambiar a</div>
          <div id="other-name" class="switch-name">Conchi</div>
        </div>
        <span class="switch-arrow">›</span>
      </button>

      <button class="cal-btn" onclick="goTo('calendar')">
        <span class="cal-btn-icon">📅</span>
        <div>
          <div class="cal-btn-title">Calendario Conjunto</div>
          <div class="cal-btn-sub">Ver todas las citas médicas →</div>
        </div>
      </button>

      <!-- Hoy -->
      <div class="card">
        <div class="card-title">🩺 Tus citas de <span>hoy</span></div>
        <div id="today-list"></div>
      </div>

      <!-- Mañana -->
      <div class="card" style="border-color:#DDD0C8">
        <div class="card-title card-title-manana">📆 Tus citas de <span style="color:#A07060">mañana</span></div>
        <div id="tomorrow-list"></div>
      </div>
    </div>
  </div>

  <!-- ══════════════ CALENDARIO SEMANAL ══════════════ -->
  <div id="screen-calendar" class="screen">
    <div class="page-header">
      <button class="back-btn" onclick="goTo('dashboard')">← Inicio</button>
      <div class="page-header-center">
        <div id="cal-month" class="page-month">Enero</div>
        <div id="cal-year" class="page-year">2025</div>
      </div>
      <div id="sync-dot-cal" class="sync-dot" style="background:#4ADE80"></div>
    </div>
    <div class="week-nav">
      <button class="nav-btn" onclick="changeWeek(-1)">‹ Anterior</button>
      <button class="today-nav-btn" onclick="goToday()">📍 Hoy</button>
      <button class="nav-btn" onclick="changeWeek(1)">Siguiente ›</button>
    </div>
    <div id="range-label" class="range-label"></div>
    <div id="days-grid" class="days-grid"></div>
    <div class="legend">
      <div class="legend-item"><div class="dot" style="background:#C75B2A"></div> Vicente</div>
      <div class="legend-item"><div class="dot" style="background:#E8895A"></div> Conchi</div>
      <div class="legend-item"><div class="dot" style="background:#78716C"></div> Ambos</div>
    </div>
  </div>

  <!-- ══════════════ DETALLE DÍA ══════════════ -->
  <div id="screen-day" class="screen">
    <div class="page-header">
      <button class="back-btn" onclick="goTo('calendar')">← Semana</button>
      <div class="page-header-center">
        <div id="day-view-name" class="day-view-name"></div>
        <div id="day-view-date" class="day-view-date"></div>
      </div>
      <div id="sync-dot-day" class="sync-dot" style="background:#4ADE80"></div>
    </div>
    <div id="cita-list" class="cita-list"></div>
    <div class="add-section">
      <div class="add-title">➕ Añadir cita médica</div>
      <input id="new-cita-input" class="add-input" type="text" placeholder="Ej: Médico de cabecera, Cardiología…" onkeydown="if(event.key==='Enter')addCita()"/>
      <div class="hora-row">
        <span class="hora-label">🕐 Hora:</span>
        <input id="new-hora-input" class="hora-input" type="time"/>
        <span class="hora-opt">(opcional)</span>
      </div>
      <div class="for-row">
        <span class="for-label">Para:</span>
        <button id="for-Vicente" class="for-btn" onclick="setForUser('Vicente')">👨 Vicente</button>
        <button id="for-Conchi" class="for-btn" onclick="setForUser('Conchi')">👩 Conchi</button>
        <button id="for-Ambos" class="for-btn active" onclick="setForUser('Ambos')">👫 Ambos</button>
      </div>
      <button class="add-btn" onclick="addCita()">Guardar cita médica</button>
    </div>
  </div>

</div>

<!-- ══════════════ FIREBASE ══════════════ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCA7BkGDX10ZjRJ8lQKK0p7GpjCdwN6iMI",
  authDomain: "citas-medicas-306d6.firebaseapp.com",
  projectId: "citas-medicas-306d6",
  storageBucket: "citas-medicas-306d6.firebasestorage.app",
  messagingSenderId: "222130205137",
  appId: "1:222130205137:web:3ce21edf3a8235acc730f0"
};

const fbApp = initializeApp(firebaseConfig);
const db    = getFirestore(fbApp);

// ── Estado global ──────────────────────────────────────────────────────────
const MONTHS   = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DAYS_S   = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DAYS_L   = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DOT_COL  = { Vicente:"#C75B2A", Conchi:"#E8895A", Ambos:"#78716C" };

let currentUser  = localStorage.getItem("medcal-user") || "Vicente";
let currentView  = "dashboard";
let weekStart    = getMonday(new Date());
let selectedDay  = null;
let forUser      = "Ambos";
let citas        = {};

// ── Helpers fecha ──────────────────────────────────────────────────────────
function getMonday(date){
  const d=new Date(date), day=d.getDay()||7;
  d.setDate(d.getDate()-day+1); d.setHours(0,0,0,0); return d;
}
function toKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function isToday(d){ const t=new Date(); return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear(); }
function isPast(d){ const t=new Date(); t.setHours(0,0,0,0); return d<t; }

// ── Firebase: escuchar cambios en tiempo real ──────────────────────────────
const docRef = doc(db, "citas", "calendario");
onSnapshot(docRef,
  snap => {
    if(snap.exists()) citas = snap.data().data || {};
    else citas = {};
    setSyncOk(true);
    renderCurrentView();
  },
  () => setSyncOk(false)
);

async function saveCitas(){
  setSyncSaving();
  try{
    await setDoc(docRef, { data: citas });
    setSyncOk(true);
  } catch{ setSyncErr(); }
}

// ── Sync UI ────────────────────────────────────────────────────────────────
function setSyncOk(){ updateSyncUI("ok"); }
function setSyncSaving(){ updateSyncUI("saving"); }
function setSyncErr(){ updateSyncUI("err"); }
function updateSyncUI(state){
  const dot = document.getElementById("sync-dot-cal");
  const dot2= document.getElementById("sync-dot-day");
  const pill= document.getElementById("sync-pill-dash");
  const colors={ ok:"#4ADE80", saving:"#FCD34D", err:"#F87171" };
  const col = colors[state]||"#4ADE80";
  if(dot){ dot.style.background=col; dot.style.boxShadow=`0 0 8px ${col}88`; }
  if(dot2){ dot2.style.background=col; dot2.style.boxShadow=`0 0 8px ${col}88`; }
  if(pill){
    pill.className="sync-pill "+(state==="ok"?"sync-ok":state==="saving"?"sync-saving":"sync-err");
    pill.textContent=state==="ok"?"✅ Conectado":state==="saving"?"🔄 Guardando…":"⚠️ Sin conexión";
  }
}

// ── Navegación ─────────────────────────────────────────────────────────────
window.goTo = function(view){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+view).classList.add("active");
  currentView=view;
  renderCurrentView();
};

function renderCurrentView(){
  if(currentView==="dashboard") renderDashboard();
  else if(currentView==="calendar") renderCalendar();
  else if(currentView==="day") renderDay();
}

// ── Cambiar usuario ────────────────────────────────────────────────────────
window.switchUser = function(){
  currentUser = currentUser==="Vicente" ? "Conchi" : "Vicente";
  localStorage.setItem("medcal-user", currentUser);
  renderDashboard();
};

// ── DASHBOARD ──────────────────────────────────────────────────────────────
function renderDashboard(){
  const other = currentUser==="Vicente" ? "Conchi" : "Vicente";
  const emojiMe = currentUser==="Vicente" ? "👨" : "👩";
  const emojiOther = other==="Vicente" ? "👨" : "👩";
  const bienvenida = currentUser==="Vicente" ? "Bienvenido, Vicente" : "Bienvenida, Conchi";

  document.getElementById("hero-emoji").textContent = emojiMe;
  document.getElementById("hero-name").textContent  = currentUser;
  document.getElementById("hero-sub").textContent   = bienvenida;
  document.getElementById("other-emoji").textContent= emojiOther;
  document.getElementById("other-name").textContent = other;

  // Hoy
  const todayKey = toKey(new Date());
  const todayAll = (citas[todayKey]||[]).filter(c=>c.forUser===currentUser||c.forUser==="Ambos");
  const todayEl  = document.getElementById("today-list");
  todayEl.innerHTML = todayAll.length===0
    ? `<div class="empty-card"><div class="ei">😊</div><div class="et">¡Hoy no tienes citas!</div></div>`
    : todayAll.map(c=>`
        <div class="today-cita${c.done?" done":""}">
          <span style="font-size:20px">${c.done?"✅":"🕐"}</span>
          <div style="flex:1">
            ${c.hora?`<div class="cita-hora">${c.hora}h</div>`:""}
            <div class="cita-texto${c.done?" done":""}">${esc(c.texto)}</div>
          </div>
        </div>`).join("")
    + `<button class="see-more-btn" onclick="openDay(new Date())">Ver detalle de hoy</button>`;

  // Mañana
  const tom = new Date(); tom.setDate(tom.getDate()+1);
  const tomKey = toKey(tom);
  const tomAll = (citas[tomKey]||[]).filter(c=>c.forUser===currentUser||c.forUser==="Ambos");
  const tomEl  = document.getElementById("tomorrow-list");
  tomEl.innerHTML = tomAll.length===0
    ? `<div class="empty-card"><div class="ei">✨</div><div class="et">¡Mañana tampoco tienes citas!</div></div>`
    : tomAll.map(c=>`
        <div class="today-cita manana${c.done?" done":""}">
          <span style="font-size:20px">${c.done?"✅":"📋"}</span>
          <div style="flex:1">
            ${c.hora?`<div class="cita-hora manana">${c.hora}h</div>`:""}
            <div class="cita-texto${c.done?" done":""}">${esc(c.texto)}</div>
          </div>
        </div>`).join("")
    + `<button class="see-more-btn manana" onclick="openDay(new Date(new Date().setDate(new Date().getDate()+1)))">Ver detalle de mañana</button>`;
}

// ── CALENDARIO ─────────────────────────────────────────────────────────────
window.changeWeek = function(dir){ const d=new Date(weekStart); d.setDate(d.getDate()+dir*7); weekStart=d; renderCalendar(); };
window.goToday    = function(){ weekStart=getMonday(new Date()); renderCalendar(); };

function renderCalendar(){
  const days = Array.from({length:7},(_,i)=>{ const d=new Date(weekStart); d.setDate(d.getDate()+i); return d; });
  const mid  = days[3];
  document.getElementById("cal-month").textContent = MONTHS[mid.getMonth()];
  document.getElementById("cal-year").textContent  = mid.getFullYear();
  document.getElementById("range-label").textContent =
    `Semana del ${days[0].getDate()} al ${days[6].getDate()} de ${MONTHS[mid.getMonth()]}`;

  const grid = document.getElementById("days-grid");
  grid.innerHTML = days.map((day,i)=>{
    const key = toKey(day);
    const dc  = citas[key]||[];
    const hoy = isToday(day);
    const past= isPast(day)&&!hoy;
    const cls = `day-cell${hoy?" today":past?" past":""}`;
    const dots= dc.slice(0,4).map(c=>`<div class="dot" style="background:${DOT_COL[c.forUser]||"#78716C"}"></div>`).join("");
    return `<button class="${cls}" onclick="openDay(new Date('${day.toISOString()}'))">
      ${hoy?`<div class="hoy-badge">HOY</div>`:""}
      <div class="cell-day-name">${DAYS_S[i]}</div>
      <div class="cell-day-num">${day.getDate()}</div>
      <div class="dots-row">${dots}</div>
      ${dc.length>0
        ?`<div class="cell-count">${dc.length} cita${dc.length>1?"s":""}</div>`
        :`<div class="cell-empty">Libre</div>`}
    </button>`;
  }).join("");
}

// ── DÍA ────────────────────────────────────────────────────────────────────
window.openDay = function(d){
  selectedDay = new Date(d);
  goTo("day");
};

function renderDay(){
  if(!selectedDay) return;
  const di  = (selectedDay.getDay()||7)-1;
  const hoy = isToday(selectedDay);
  document.getElementById("day-view-name").textContent =
    (hoy?"HOY · ":"")+DAYS_L[di];
  document.getElementById("day-view-date").textContent =
    `${selectedDay.getDate()} de ${MONTHS[selectedDay.getMonth()]} de ${selectedDay.getFullYear()}`;

  const key  = toKey(selectedDay);
  const dc   = citas[key]||[];
  const list = document.getElementById("cita-list");

  list.innerHTML = dc.length===0
    ? `<div class="empty-day"><div class="ei">🗓️</div><div class="et">Sin citas este día</div><div class="es">Añade una cita abajo</div></div>`
    : dc.map(c=>`
      <div class="cita-item${c.done?" done":""}">
        <button class="check-btn" onclick="toggleCita('${key}','${c.id}')">
          <span style="font-size:26px">${c.done?"✅":"⬜"}</span>
        </button>
        <div style="flex:1;overflow:hidden">
          ${c.hora?`<div class="item-hora">${c.hora}h</div>`:""}
          <div class="item-texto${c.done?" done":""}">${esc(c.texto)}</div>
          <div class="item-meta">
            <span class="badge badge-${c.forUser.toLowerCase()}">${c.forUser}</span>
            <span class="badge-meta"> · añadido por ${c.addedBy}</span>
          </div>
        </div>
        <button class="del-btn" onclick="deleteCita('${key}','${c.id}')">🗑️</button>
      </div>`).join("");
}

window.toggleCita = function(key,id){
  citas[key] = (citas[key]||[]).map(x=>x.id===id?{...x,done:!x.done}:x);
  saveCitas(); renderDay(); renderDashboard();
};
window.deleteCita = function(key,id){
  cancelNotification(id);
  citas[key] = (citas[key]||[]).filter(x=>x.id!==id);
  saveCitas(); renderDay(); renderDashboard();
};
window.addCita = function(){
  const texto = document.getElementById("new-cita-input").value.trim();
  if(!texto||!selectedDay) return;
  const hora = document.getElementById("new-hora-input").value;
  const key  = toKey(selectedDay);
  if(!citas[key]) citas[key]=[];
  citas[key].push({
    id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
    texto, hora, forUser, addedBy: currentUser, done:false
  });
  citas[key].sort((a,b)=>(a.hora||"99:99").localeCompare(b.hora||"99:99"));
  saveCitas();
  // Programar notificación 24h antes
  const nuevaCita = citas[key].find(c=>c.texto===texto && c.hora===hora && c.addedBy===currentUser);
  if(nuevaCita) scheduleNotification(nuevaCita, key);
  document.getElementById("new-cita-input").value="";
  document.getElementById("new-hora-input").value="";
  renderDay(); renderDashboard();
};
window.setForUser = function(u){
  forUser=u;
  ["Vicente","Conchi","Ambos"].forEach(x=>{
    document.getElementById("for-"+x).classList.toggle("active",x===u);
  });
};

// ── Notificaciones ─────────────────────────────────────────────────────────
const NOTIF_KEY = "medcal-notifs";

function getScheduledNotifs(){
  try{ return JSON.parse(localStorage.getItem(NOTIF_KEY)||"{}"); } catch{ return {}; }
}
function saveScheduledNotifs(obj){
  localStorage.setItem(NOTIF_KEY, JSON.stringify(obj));
}

async function requestNotifPermission(){
  if(!("Notification" in window)) return false;
  if(Notification.permission === "granted") return true;
  if(Notification.permission === "denied") return false;
  const result = await Notification.requestPermission();
  return result === "granted";
}

function scheduleNotification(cita, dateKey){
  if(!("Notification" in window)) return;
  if(Notification.permission !== "granted") return;

  // dateKey = "YYYY-MM-DD", cita.hora = "HH:MM" or ""
  const [y,m,d] = dateKey.split("-").map(Number);
  let citaTime;
  if(cita.hora){
    const [h,min] = cita.hora.split(":").map(Number);
    citaTime = new Date(y, m-1, d, h, min, 0).getTime();
  } else {
    citaTime = new Date(y, m-1, d, 9, 0, 0).getTime(); // default 9:00
  }

  const notifTime = citaTime - 24*60*60*1000; // 24h before
  const now = Date.now();
  if(notifTime <= now) return; // already passed

  const delay = notifTime - now;
  const notifId = cita.id;

  // Cancel existing timeout for this cita if any
  const scheduled = getScheduledNotifs();
  if(scheduled[notifId]){
    clearTimeout(scheduled[notifId].timeoutId);
  }

  const timeoutId = setTimeout(()=>{
    new Notification("🏥 Cita mañana", {
      body: `${cita.texto}${cita.hora ? " a las "+cita.hora+"h" : ""} (${cita.forUser})`,
      icon: document.querySelector("link[rel='apple-touch-icon']").href,
      badge: document.querySelector("link[rel='apple-touch-icon']").href,
    });
    // Remove from scheduled after firing
    const s = getScheduledNotifs();
    delete s[notifId];
    saveScheduledNotifs(s);
  }, delay);

  scheduled[notifId] = { timeoutId, notifTime, texto: cita.texto };
  saveScheduledNotifs(scheduled);
}

function cancelNotification(citaId){
  const scheduled = getScheduledNotifs();
  if(scheduled[citaId]){
    clearTimeout(scheduled[citaId].timeoutId);
    delete scheduled[citaId];
    saveScheduledNotifs(scheduled);
  }
}

// Re-schedule all future notifications on app load
function restoreNotifications(){
  if(Notification.permission !== "granted") return;
  const now = Date.now();
  Object.entries(citas).forEach(([key, arr])=>{
    (arr||[]).forEach(c=>{
      if(!c.done) scheduleNotification(c, key);
    });
  });
}

// ── Utilidad ───────────────────────────────────────────────────────────────
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ── Inicio ─────────────────────────────────────────────────────────────────
goTo("dashboard");

// Pedir permiso de notificaciones al arrancar
(async ()=>{
  const granted = await requestNotifPermission();
  if(granted) restoreNotifications();
})();
</script>
</body>
</html>
